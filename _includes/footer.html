<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>
  <div class="frame foot-bar">
    <nav class="foot-links" aria-label="Footer">
      <a href="{{ "/sitemap.md" | relative_url }}">sitemap.md</a>
      <a href="{{ "/llms.txt" | relative_url }}">llms.txt</a>
      <a href="{{ "/feed.xml" | relative_url }}">rss.xml</a>
    </nav>
    <p class="foot-note">© 2026 {{ site.title | escape }}</p>
  </div>
</footer>

<style>
  .site-footer { border-top: 1px solid var(--line); background: var(--bg); }
  .site-footer .foot-bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px 32px; padding: 24px 24px; border-left: 0; border-right: 0;
  }
  .foot-links { display: flex; flex-wrap: wrap; gap: 8px 24px; }
  .foot-links a {
    font: 400 13px/1.4 var(--mono); letter-spacing: 0;
    color: var(--fg-muted); transition: color .15s;
  }
  .foot-links a:hover { color: var(--fg); }
  .foot-note { margin: 0; font: 400 12px/1.4 var(--mono); color: var(--fg-faint); }
</style>
